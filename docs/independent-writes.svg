<svg xmlns="http://www.w3.org/2000/svg" width="760" height="615" viewBox="0 0 760 615" role="img" aria-labelledby="title desc"><title id="title">independent-writes — causality and races</title><desc id="desc">Workers run downward by schedule step, not physical time. Blue arrows are messages; purple dashed arrows are mutex synchronization. Red dashed connectors identify conflicting unordered accesses.</desc><defs><marker id="message" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker><marker id="mutex" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker><marker id="program" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs><style>text{font-family:system-ui,Segoe UI,sans-serif;fill:#0f172a}.mono{font-family:Consolas,monospace}.muted{fill:#475569}.small{font-size:12px}.label{font-size:14px;font-weight:600}</style><rect width="100%" height="100%" fill="#f8fafc"/><rect x="0" y="0" width="760" height="170" fill="#e2e8f0"/><text x="28" y="34" font-size="12" letter-spacing="2" class="muted">VECTOR CLOCK / RACE DETECTOR</text><text x="28" y="68" font-size="25" font-weight="700">independent-writes</text><text x="28" y="96" font-size="14">2 workers · 3 events · 2 concurrent pairs · 1 races · graph verified: true</text><text x="28" y="122" class="small muted">Downward = schedule order, not elapsed time. Numeric clock order alone does not prove causality.</text><path d="M28 146 h24" stroke="#2563eb" stroke-width="2" marker-end="url(#message)"/><text x="60" y="150" class="small">Message</text><path d="M145 146 h24" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 3"/><text x="178" y="150" class="small">Mutex</text><path d="M250 146 h24" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/><text x="282" y="150" class="small">Race (unordered)</text><text x="435" y="150" class="small muted">V = vector · L = Lamport · wall = fixture ns</text><text x="60" y="200" class="label">WORKER 0</text><line x1="60" y1="214" x2="60" y2="580" stroke="#cbd5e1" stroke-width="2"/><text x="400" y="200" class="label">WORKER 1</text><line x1="400" y1="214" x2="400" y2="580" stroke="#cbd5e1" stroke-width="2"/><path d="M60 247 C60 295 60 290 60 336" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#program)"><title>program: e0 → e1</title></path><path d="M60 345 C35 405 375 390 400 450" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"><title>Race on x: e1 ↔ e2 (causally unordered)</title></path><g><title>e0 · read y; vector [1, 0]; Lamport 1; wall 1000000 ns</title><circle cx="60" cy="240" r="6" fill="#0f766e"/><rect x="76" y="214" width="265" height="78" rx="8" fill="#ffffff" stroke="#cbd5e1"/><text x="87" y="234" class="label">e0 · read y</text><text x="87" y="256" class="mono" font-size="14">V [1, 0]</text><text x="87" y="277" class="small muted">L 1 · wall 1000000 ns</text></g><g><title>e1 · write x; vector [2, 0]; Lamport 2; wall 2000000 ns</title><circle cx="60" cy="345" r="6" fill="#dc2626"/><rect x="76" y="319" width="265" height="78" rx="8" fill="#fff1f2" stroke="#fca5a5"/><text x="87" y="339" class="label">e1 · write x</text><text x="87" y="361" class="mono" font-size="14">V [2, 0]</text><text x="87" y="382" class="small muted">L 2 · wall 2000000 ns</text></g><g><title>e2 · write x; vector [0, 1]; Lamport 1; wall 3000000 ns</title><circle cx="400" cy="450" r="6" fill="#dc2626"/><rect x="416" y="424" width="265" height="78" rx="8" fill="#fff1f2" stroke="#fca5a5"/><text x="427" y="444" class="label">e2 · write x</text><text x="427" y="466" class="mono" font-size="14">V [0, 1]</text><text x="427" y="487" class="small muted">L 1 · wall 3000000 ns</text></g></svg>